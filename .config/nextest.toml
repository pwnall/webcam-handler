# nextest configuration.
#
# One rule, and it exists because a camera is a physical thing.
#
# ## Why the hardware rungs cannot run concurrently
#
# V4L2 allows **one streamer per node**. That is not a limitation to work around — it is
# the property D12 builds the daemon's per-camera actor around, and the property
# `Camera::start_stream` reports as `Error::Busy`. nextest runs each test in its own
# process and several at once, so two `#[ignore]`d hardware tests that both stream from
# `/dev/video0` are two processes contending for an exclusive device, and the loser sees a
# perfectly correct `EBUSY` from a perfectly correct backend.
#
# Observed, on the run that landed the streaming path: `hw_a_stream_negotiates_…` and
# `hw_a_stream_honours_a_size_…` overlapped, and the second failed with "/dev/video0 is
# busy". The bug was in the suite, not in the code under test — the suite was modelling a
# world with three cameras per test rather than three cameras per machine.
#
# A test group with one thread is the smallest thing that models the real constraint. The
# alternative — teaching each test to tolerate `Busy` — would make every hardware test
# able to pass by doing nothing, which is exactly the "skip reads as pass" failure docs/8
# Part C names.
#
# ## Why the filter is the suite prefixes
#
# `hw_` (R3, real hardware) and `vivid_` (R2, the virtual driver) both enumerate
# `/dev/video*` and both open nodes from it, so they contend with each other as well as
# among themselves. The prefixes are the same ones `scripts/*.sh` declare in their
# `wch-suite:` markers, and `scripts/gates/ignored-suites-have-recipes.sh` asserts that
# every declared prefix appears here — so a new rung cannot be added, or an existing one
# renamed, without this file following it.

# ## Why every test has a deadline
#
# A test that hangs produces no message, and `just ci` turns from red into
# never-finishing — which is the failure nobody debugs, because there is nothing to read.
# It is a real shape here and not a hypothetical: the daemon suites read a child process's
# stderr and a camera actor's reply channel, and both of those bound themselves on the
# other end speaking. A logging change that removed the line a fixture waits for, or a
# housekeeping pass that queued behind a wedged actor, is a hang rather than a failure.
#
# A deadline that turns a hang into a named failure is not synchronisation and does not
# breach the no-sleep rule — `scripts/gates/uds-permissions.sh` says the same thing about
# its own `timeout 60`, and for the same reason. Nothing waits on this to learn anything;
# it exists so that when a test stops finishing, the run says which one.
#
# Three minutes, which is two orders of magnitude past the whole suite's runtime.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

[test-groups.exclusive-device]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/(^|::)hw_/) + test(/(^|::)vivid_/)'
test-group = 'exclusive-device'
# Longer, because these are the only tests that wait for hardware: a motion sweep is
# bounded by `MAX_MOTION_SWEEP_SAMPLES` samples at `DEFAULT_SETTLE_DEADLINE_MS` each, so
# minutes is a legitimate runtime here and three of them is not. Still bounded — a
# hardware test that hangs is a hang like any other.
slow-timeout = { period = "300s", terminate-after = 4 }

# ## Why one binary's *successful* output is shown
#
# `crates/daemon/tests/web_browser.rs` is R1-web, the browser rung (design §3.1), and it is
# the one suite in this workspace that **auto-skips on a host that cannot run it** — no node,
# no pinned Playwright, no pinned browser. AGENTS rule 3 says every auto-skipping rung reports
# a named, counted skip and never silence, and nextest hides a passing test's output: without
# this line the decline would be printed into a void and `just ci` would carry a skip nobody
# could see, which is exactly "skip reads as pass".
#
# `final` rather than `immediate` so the line lands in the run's summary, where the other
# rungs' counted skips are read.
#
# The suite is **not** in the `exclusive-device` group and must not be: it drives the fake
# backend over a loopback socket and opens no `/dev/video*`, so serialising it with the
# hardware rungs would be a claim about contention that does not exist.
# ## Why the oracle rung's output is shown for the same reason
#
# `crates/engine/tests/oracles.rs` is the container-oracle rung (docs/7 P6d), and like the browser
# rung it is **not** `#[ignore]`d and **does** auto-skip: a host with no `ffprobe` and no `mpv`
# cannot ask either of them anything. AGENTS rule 3 names this rung explicitly — "every
# auto-skipping rung (vivid, hardware, oracles) reports a named, counted skip — never silence" —
# and nextest hides a passing test's output, so without this line the decline would be printed
# into a void.
#
# It is **not** in the `exclusive-device` group and must not be: it records over the fake backend
# and opens no `/dev/video*`, so serialising it with the hardware rungs would be a claim about
# contention that does not exist. The oracles it shells out to read a finished file and touch no
# device either.
#
# `testkit`'s own `oracle::` arms decline the same way and are **not** named here, deliberately:
# they share a binary with the conformance battery, and `success-output = "final"` on that binary
# would print several hundred passing unit tests' output on every run. `scripts/rung-oracles.sh`
# passes the flag on its own command line instead, which is where those declines are read.
[[profile.default.overrides]]
filter = 'binary(oracles)'
success-output = "final"

[[profile.default.overrides]]
filter = 'binary(web_browser)'
success-output = "final"
# Longer than the default for one reason: this test's runtime is a child process launching a
# browser, and a cold Chromium start on a loaded machine is seconds rather than milliseconds.
# Still bounded, and still not synchronisation — nothing waits on this to learn anything.
slow-timeout = { period = "120s", terminate-after = 3 }

# ## Why two of the privileged helper's tests show their output, added 2026-08-16
# ## (notes **N160**, **N167**)
#
# `crates/priv/src/modules.rs` holds the only executable proof of design §2.13's interlock —
# that `cycle_uvcvideo` refuses to unload `uvcvideo` while a `/dev/video*` node is open — and
# beside it the non-vacuity check that makes that proof mean anything, that the holder scan can
# see a node this process deliberately opened. Both need a camera, and until 2026-08-16 both met
# a host without one with a bare `return`: the G6 review found them proving nothing and saying
# nothing, which is AGENTS rule 3's "skip that reads as pass" in the one place where what goes
# unproved is the bound on what a root-capable binary may do.
#
# They print one census line each now — `SKIP:` when the host lends no node, `HELD:` when it
# does — and nextest hides a passing test's output, so without this the line would go into the
# same void the two rungs above were named here to escape.
#
# ## Why the filter names two tests rather than the binary
#
# **`success-output = "final"` shows every passing test's captured stdout, libtest banner
# included** — it is not a filter on what a test chose to print. Measured on 2026-08-16:
# `binary(webcam-handler-priv)` turned a 30-line run into 208, twenty near-identical `stdout ───`
# blocks, in which the one line rule 3 is about would be the hardest thing on the screen to find.
# The paragraph that first justified it here claimed the other 18 tests print nothing; one of them
# (`status_verbs_work_without_a_blessing`) prints two JSON documents, and the banner made the other
# 17 noisy anyway. A repair that buys ~140 lines of permanent noise per `just ci` to make one line
# visible has spent the reader's attention on the wrong thing (note **N167**).
#
# So the override names the two host-dependent tests, and the run grows by two blocks whose
# content is exactly the census. The cost of naming tests rather than a binary is a coupling to
# their names, which a rename breaks in silence — held by
# `the_two_claims_a_host_may_not_be_able_to_make_are_the_ones_nextest_is_told_to_print`, which
# reads this file and goes red on either name or on the override's removal.
#
# Two shapes were rejected. `testkit`'s arrangement — pass `--success-output` on a wrapper
# script's own command line — needs a wrapper, and these tests run under plain `just ci` nextest
# with no rung of their own. Moving the claim to a shell predicate, where `gate_skip` prints
# *and* counts, is note N44's remedy and it is wrong here for the reason N160 gives: the claim is
# about the **code**, and only its precondition is about the host, so a predicate would have to
# build and run a root-capable binary on every push.
#
# It is **not** in the `exclusive-device` group and must not be: neither test streams. They open
# a node, read `/proc`, and close it, which contends with nothing — and putting them in a
# one-thread group would be a claim about contention that does not exist. `CAMERA_FD` inside the
# module serializes the pair against each other, which is a different claim and the right one.
[[profile.default.overrides]]
filter = '''
    binary(webcam-handler-priv) and (
        test(the_holder_scan_reads_this_process_and_survives_unreadable_ones)
        or test(cycling_refuses_while_a_camera_is_open_unless_forced)
    )
'''
success-output = "final"
