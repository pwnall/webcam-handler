[package]
name = "webcam-handler-xtask"
description = "Build-side tasks: emit the JSON Schema bundle and OpenRPC document, shell completions, man pages, and the generated agent usage guide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
# The full name, like every other binary in this workspace (note **N90**, owner's ruling
# 2026-08-13, extended to this crate on request the same day). It costs nothing here and it
# is the reason it was worth doing: nothing invokes this program by its binary name.
# `just generate` and `schema-artifacts-current.sh` both reach it with
# `cargo run -p webcam-handler-xtask --`, and the gate rows select it with `package(…)`, so
# the rename touches this line and no call site. The `xtask/` directory keeps its short name,
# which is the same clarification N90 records for `crates/`.
name = "webcam-handler-xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
schemars.workspace = true
serde_json.workspace = true
# The wire surface, for the OpenRPC document: the method inventory and the D13 code
# registry are read from the crate that owns them, never transcribed here.
webcam-handler-api.workspace = true
webcam-handler-schema.workspace = true
