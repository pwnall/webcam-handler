[package]
name = "webcam-handler-xtask"
description = "Build-side tasks: emit the JSON Schema bundle and OpenRPC document, shell completions, man pages, and the generated agent usage guide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
# The full name, like every other binary in this workspace (note **N90**, owner's ruling
# 2026-08-13, extended to this crate on request the same day). It costs nothing here and it
# is the reason it was worth doing: nothing invokes this program by its binary name.
# `just generate` and `schema-artifacts-current.sh` both reach it with
# `cargo run -p webcam-handler-xtask --`, and the gate rows select it with `package(…)`, so
# the rename touches this line and no call site. The `xtask/` directory keeps its short name,
# which is the same clarification N90 records for `crates/`.
name = "webcam-handler-xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
# The agent guide walks the command tree it documents, so it names `clap::Command` and
# `clap::Arg` in its own signatures. No parser is built here: the tree comes from
# `webcam-handler-cli-core`, which owns it (T4).
clap.workspace = true
schemars.workspace = true
serde_json.workspace = true
# The wire surface, for the OpenRPC document: the method inventory and the D13 code
# registry are read from the crate that owns them, never transcribed here.
webcam-handler-api.workspace = true
# The one command surface (T4), for the agent usage guide (docs/7 P6e): the verb vocabulary,
# every flag and every `--json` contract are read out of the crate that declares them, so the
# guide cannot describe a verb this build does not have. This edge crosses no wall —
# `webcam-handler-cli-core` is one of design §2.8's *pure* crates and links no backend, no
# engine and no runtime, which is what `scripts/gates/dependency-walls.sh` asserts about it
# and what makes it safe for a build-side tool to depend on.
webcam-handler-cli-core.workspace = true
webcam-handler-schema.workspace = true
