# cargo-mutants configuration — the P3f mutation floor (docs/7 P3f, docs/9 Part 2).
#
# The job asks one question the rest of the suite cannot: do the tests *constrain* the
# pure cores, or merely execute them? `just mutants` (scripts/mutants.sh) is the entry
# point; this file is the scope, and the scope is the whole design decision.
#
# ## What is in scope, and why exactly this
#
# docs/7 P3f names the population: "the pure cores — planners, state machine, settle,
# metrics, store logic". Those are six files, and `examine_globs` below is that sentence
# transcribed:
#
#   pairing.rs   the guarded-write planner and its inverse validator (D3)
#   sweep.rs     the sweep planner (D8)
#   session.rs   the calibration state machine (D8)
#   settle.rs    the settle policy state machine (D5)
#   store.rs     the session directory, atomic writes, the one fd-lock (D9)
#   metrics.rs   the D8 metric set as pure functions over a luma image
#
# P4a added a third crate's worth of the same shape, and widening the floor is adding a
# line, so three lines were added:
#
#   api/codes.rs the D13 -> JSON-RPC code registry and its inverse (`rpc_code`, `typed`)
#   api/photo.rs the wire photo answer's `bytes_match_the_delivery` predicate
#   api/wire.rs  the doc-slicing folds the OpenRPC emitter reads (`summary`, `description`)
#
# They belong here for the reason the six do: every one takes values and returns values,
# `webcam-handler-api` starts no runtime and opens nothing (note N5's review-held half),
# and the crate is where a survivor is a unit test somebody can write today. It was also
# not a hypothesis — the P4a review found two survivors here by hand before the floor
# could see them, which is the argument for the widening in one sentence.
#
# Every one of them is a fold over values (engine's lib.rs states the property: reads no
# clock, opens no file, touches no global — store.rs takes its directory as an argument).
# That is what makes a surviving mutant *actionable* here: if a changed line cannot be
# noticed, the missing test is a unit test somebody can write today, not a rig.
#
# P4d added one more line, and it is the first from a *backend*:
#
#   v4l2/hotplug.rs  what one uevent packet is worth to the watch, and the debounce fold
#
# It is in scope for the same reason and against the same exclusion below: `sys/uevent.rs`
# is the socket and stays out, while `hotplug.rs` takes a byte slice (and, for the
# debounce, `Instant`s the caller supplies) and returns a value. It opens nothing, reads
# no clock and makes no syscall, so a survivor here is a unit test somebody can write
# today over a committed packet fixture. Writing the exclusion down was not optional —
# this file's own header rules out silence — and the answer is "in".
#
# **It earned its keep on the first run over it**, which is the argument for widening a
# floor rather than trusting a file because its tests look thorough. 36 mutants, one
# survivor: `Tracker::next_deadline` replaced with `None`. `Debounce::next_deadline` is
# asserted four ways one module down, but nothing asserted that the `Tracker` *forwards*
# it and nothing asserted the consequence — a watch that never wakes early hands a settled
# burst to its caller at the caller's deadline instead of at the burst's, so a subscriber
# offered a generous deadline waits all of it for an event that was ready in a quarter of
# a second. It is neither equivalent nor unkillable, so it is not in
# `scripts/mutants-accepted.txt`: `watch::tests::a_settled_burst_is_reported_when_it_
# settles_and_not_when_the_caller_gives_up` kills it, watched failing at 10.01s against a
# hand-applied copy of the mutant before it was called done.
#
# ## What is out of scope, and why
#
# - `crates/backends/v4l2/src/sys/` — the unsafe ioctl edge, and since P4d the uevent
#   socket beside it. A mutant there is only
#   decidable against a device, so every survivor would be an R2/R3 finding wearing a
#   CI costume. Miri and the vivid rung own that half (docs/9's recorded limits). The
#   split is deliberate and is why the packet *decision* lives outside `src/sys/` in
#   `hotplug.rs`: putting it in the socket module would have taken a pure fold out of the
#   floor's reach.
# - `crates/backends/v4l2/src/watch.rs` — the third piece of the same edge, and the only
#   one that is not a fold: it reads `Instant::now()`, calls `poll` and `recv`, and joins
#   `hotplug`'s decisions to `sys::uevent`'s syscalls. Its mutants are decidable, but only
#   against a socket and a clock — a mutated `budget` or a mutated deadline comparison is
#   a *timing* survivor, which is the class note N52 records this floor being bad at.
#   Everything it does that can be decided from values was deliberately pushed one module
#   down into `hotplug.rs`, so what is left here is exactly what does not belong.
#   Its own tests still assert every one of those behaviours over a datagram pair, and
#   nine hand-written mutants were watched failing before the module landed.
# - `cli-core::render`, `crates/cli`, `crates/web` — rendering. Mutating a column width
#   or a plural produces survivors by the hundred that say only "the golden output is not
#   byte-asserted", which is a decision docs/6 already made deliberately.
# - `engine::calibrate`, `engine::lifecycle`, `engine::discover`, `engine::capture`,
#   `engine::photo`, `engine::snapshot`, `engine::write`, `engine::actor` — the imperative
#   shell. These are
#   in scope for a *later* widening, not for the floor: they are where the tests are
#   integration-shaped, so a survivor there needs a seam argument before it needs a test,
#   and the triage would drown the signal from the cores. Named here so the exclusion is a
#   decision with a date rather than an oversight. `actor.rs` (P4b) is the newest and the
#   closest call: its `Idle` deadline *is* a fold over two numbers and belongs here on the
#   merits, but the file it lives in also owns a thread, a registry and a bounded queue,
#   whose survivors would each need a rig. Split the fold out, or widen to the file and
#   accept the triage — either is a decision somebody should make on purpose.
#   **Made on purpose at P4c, and the answer is still no.** P4c changed when a camera is
#   idle (note N45's clock-free shape), and the change did *not* land in the fold: the
#   flag it added is raised by `Thread::publish` under the same mutex as `busy`, taken by
#   `CameraActor::sweep`'s filter and cleared by `Liveness`'s drop guard, which is
#   thread-and-registry code and not two numbers. So widening to the file would import
#   exactly the triage this paragraph warns about, and splitting `Idle` out would move a
#   fold whose arithmetic P4c did not touch. Both directions of the new behaviour have a
#   test in `engine::actor` and both go red when the filter's take is neutered; that is
#   what carries it until somebody splits the module for its own reasons.
# - `crates/schema` — mostly derives and data. Its laws are asserted by the battery.
# - `crates/api/src/lib.rs` — the T5 trait itself. It is a `wire_surface!` invocation and
#   nineteen doc comments; there is no expression in it to mutate, and the macro's own
#   expansion is jsonrpsee's. The three modules beside it are where this crate computes.
#
# - `crates/daemon`, everything but the three `http` folds below. **This crate appeared
#   nowhere in this file until P5e, in neither list, which is the one state the paragraph
#   above forbids: an exclusion that is not a decision with a date is an oversight wearing
#   one.** Named now, and the shape is the same argument the engine's shell gets.
#   `daemon::http::listener` is composition — it binds a socket, and its survivors are
#   answered by `tests/http.rs` driving a real one. `daemon::http::rpc` is four lines of
#   route plus `without_the_query`, and the fold half already has three unit tests over
#   values; mutating the rest needs an upgrade. `daemon::http::preview` writes multipart
#   frames onto a socket and `daemon::preview` bridges an actor's watch channel to it —
#   both are decidable only against a reader, which is `tests/preview.rs`'s job and not a
#   mutant's. `daemon::events`, `server`, `shutdown`, `state`, `systemd`, `uds` and
#   `logging` are the same class as `engine`'s shell: a thread, a registry, a bounded
#   queue or a signal, each of whose survivors needs a rig before it needs a test.
#
# The exclusions are stated as *absence from `examine_globs`* rather than as
# `exclude_globs`, so widening the floor is adding a line rather than deleting one.
#
# ## What P6a widened, and the state it was found in (2026-08-14)
#
# `crates/imaging/src/avi/` — the AVI muxer and the reader beside it. It landed appearing
# **in neither list**, which is the one state the `crates/daemon` paragraph above records as
# forbidden: an exclusion that is not a decision with a date is an oversight wearing one.
# The P6a review found it there and the answer is "in", for the reason `metrics.rs` two
# directories along is already in:
#
#   avi.rs        the shared value types and `interval_micros`, a total fold over a
#                 `FrameInterval` that refuses to guess (AGENTS rule 6)
#   avi/read.rs   `read_stream` and `recover_frames`: `&[u8]` in, values out. It opens
#                 nothing, reads no clock and makes no syscall, and every refusal in it is
#                 seeded by a fixture built byte by byte in the same file
#   avi/write.rs  the muxer. It takes a `W: Write + Seek` rather than values, which would
#                 normally put it with `engine`'s shell; what makes it decidable is the same
#                 thing that carried `engine::preview` in at P5e — its whole suite drives it
#                 over a `Cursor<Vec<u8>>` and a scripted `ShortSink` with a budget, so "the
#                 close-time rewrite reached both homes of the rate" and "the size cap counts
#                 the index" are claims a mutant can break and a test can catch with no rig
#
# The cost is measured rather than guessed: 318 mutants, taking the floor's population from
# 624 to 942. That is the largest single widening this file has taken and it is worth
# stating, because it is also roughly a 50% increase in a job whose header already says
# hours not minutes.
#
# **It earned its keep on the first run over it**, which is the P4d precedent repeating.
# 318 mutants: 274 caught, 33 unviable, no timeouts, and **eleven survivors**. Nine were
# real gaps and became tests in the same session; the two that are left are equivalent
# mutants, argued in note **N101** and registered in `scripts/mutants-accepted.txt`. What
# the nine were is the argument for the widening in one list — a twelve-byte file (a whole
# RIFF envelope and nothing else) refused as a foreign format instead of as a truncated
# recording; `recover_frames` silently dropping `00db` frames *and* handing back another
# stream's chunks as ours; the chunk-header room comparison wrong in both off-by-one
# directions, one of which reads a 3-byte tail as a chunk header; a one-digit stream id
# accepted as a stream chunk; a `LIST odml` inside `hdrl` — legal, and emitted by many
# writers — parsed as a stream list; and `find_movi` walking a RIFF file that is not an AVI.
# Not one of them is a message-only nicety, and none of them was reachable by the suite that
# shipped with the module.
#
# One honest qualification about that run: it was executed at **crate** scope
# (`--package webcam-handler-imaging`) rather than at the workspace scope this file pins,
# because the workspace build per mutant made the full run impractical in one session. The
# result is sound for these files and no stronger claim is being made: workspace scope runs
# a superset of crate scope's tests, so it can only kill more, and at P6a nothing outside
# `webcam-handler-imaging` references `imaging::avi` at all — P6b is where the engine picks
# it up. The first workspace-scope run to include these files is therefore expected to
# reproduce exactly the two accepted survivors, and the register is checked both ways, so it
# will say so if it does not.
#
# ## What P5e widened, and why each of the four earns it
#
# The owner asked for the floor over P5's code on 2026-08-13, on the ground that it has
# caught bugs before. It has, and the record is specific: E7 surfaced **forty-eight
# distinct survivors**, thirty-eight of which became tests, and the defects among them were
# real — an availability failure reported as "nothing here" twice in the store (AGENTS rule
# 7, in the one place a `SessionConflict` would follow), a fault fixture that had stopped
# producing its own fault, a lock record that could name nobody, and the sweep planner's
# entire capping arithmetic unpinned by a suite that asserted the cap's *shape* and never
# its answer.
#
# - `daemon::http::posture` — D11's bind × token matrix, which docs/7 P5a describes as "a
#   pure function over a `SocketAddr` and the one flag the paragraph names". It is the
#   shape this floor exists for, and it decides who may reach a camera.
# - `daemon::http::token` — mint, verify, the redacting `Debug`, the ready-to-open URL.
#   **It was added expecting a survivor, and the expectation was wrong in a way worth
#   writing down.** The reasoning was: note **N78** records that `==` for `Token::verify`
#   is behaviourally identical on every input and killable by no test here, so putting the
#   file in scope would make the floor *see* that mutant and turn the claim into a line in
#   `scripts/mutants-accepted.txt` rather than a sentence in a gate's header. The first run
#   over this file generated **31 mutants and caught all 31**, including
#   `replace != with ==` and both `Token::verify -> bool` constants. N78's mutant is not
#   among them and cannot be: it is a *rewrite of the comparison's shape* — a constant-time
#   loop replaced by a short-circuiting `==` — and cargo-mutants substitutes operators and
#   return values rather than restructuring an algorithm. So `token-comparison-has-one-
#   home.sh` remains the only thing holding that claim, exactly as N78 says, and this file
#   is in scope on the ordinary merit instead: thirty-one mutations of a secret's handling,
#   all constrained.
# - `daemon::http::gate` — note **N74**'s policy over values: `admits`, `bearer` and
#   `query_tokens` decide what a request presenting two credentials means, and every one of
#   them is a fold the sixteen unit tests beside them already drive.
# - `engine::preview` — note **N83**'s suspend/resume sequence. It takes an `OpenCamera`
#   rather than values, which would normally put it with the shell; what makes it decidable
#   is that its whole suite drives a `ScriptedCamera` with an exhaustive fault menu, so
#   "the resume asks for the stream that was suspended" is a claim a mutant can break and a
#   test can catch without a device.
# ## What P6b widened, and the one honest qualification on it (2026-08-14)
#
# `crates/imaging/src/y4m.rs` and `crates/imaging/src/video.rs` — the D7 raw fallback and the
# one entry point both containers are reached through. They are in for the reason
# `avi/write.rs` one directory along is in: `Y4mWriter` takes a `W: Write` rather than values,
# which would normally put it with `engine`'s shell, and what makes it decidable is that its
# whole suite drives it over a `Cursor<Vec<u8>>` and a scripted `ShortSink` with a budget. So
# "the size projection counts the `FRAME` marker", "the chroma plane is half-height at 4:2:0"
# and "a Y4M take never claims a measured interval" are claims a mutant can break and a test
# can catch with no rig. `video.rs` is thinner — an exhaustive match per method, a pairing
# check and a compile-time ceiling — and is in because a survivor there is a unit test
# somebody can write today.
#
# `crates/schema/src/video.rs` is deliberately **out**, and the exclusion is the ordinary
# `crates/schema` one rather than a new argument: it is derives, data and two exhaustive
# matches over a two-variant enum, and its laws are asserted by `imaging::video`'s pairing
# walk, which is in scope. `VideoFormat::resolve` is the one fold in it that computes, and the
# same walk drives both of its branches.
#
# **The floor has not been run against any of these.** P6b added them to the scope and
# stopped there; the first run over them is owed, and note **N101**'s precedent says to expect
# it to find something. The eight mutants P6b applied by hand were all killed (notes **N106**,
# **N107**, **N108** record what they were and what one of them found), but eight
# hand-chosen mutants is not a floor — the whole point of this job is the mutations nobody
# thought of.
# ## What P6b's engine half widened, and the qualification it inherits (2026-08-14)
#
# `crates/engine/src/record.rs` — the recording executor: the turn-based device half, the
# `Recording` sink half, the loop built from both, and the `Files` seam a full disk is
# scripted at. It takes an `OpenCamera` and a `&mut dyn Files` rather than values, which
# would normally put it with `engine`'s shell; what makes it decidable is the argument
# `engine::preview` came in on at P5e and `avi/write.rs` came in on at P6a — its whole suite
# drives a `ScriptedCamera`, the fake replaying two committed profiles, and a scriptable
# `SinkFault` menu over real files in a scratch directory, so "the loop stops asking the
# device once a cap refuses a frame", "a duration past the cap is refused rather than
# clamped" and "a sink failure becomes `StorageIo` naming the path" are claims a mutant can
# break and a test can catch with no rig and no camera.
#
# `crates/schema/src/video.rs` stays **out**, on the ordinary `crates/schema` exclusion and
# not on a new argument, exactly as P6b's first half left it: `RecordRequest`'s three
# predicates are folds, and the walk that drives both directions of each of them
# (`schema::video`'s own suite, and `engine::record`'s) is what holds them.
#
# **The floor has not been run against `record.rs`.** P6b's engine half added the line and
# stopped there, exactly as its imaging half did one commit earlier; the twelve mutants it
# applied by hand were all killed and one of them found a real gap (note **N112**), but
# twelve hand-chosen mutants is not a floor — the whole point of this job is the mutations
# nobody thought of.
examine_globs = [
    "crates/api/src/codes.rs",
    "crates/api/src/photo.rs",
    "crates/api/src/wire.rs",
    "crates/backends/v4l2/src/hotplug.rs",
    "crates/daemon/src/http/gate.rs",
    "crates/daemon/src/http/posture.rs",
    "crates/daemon/src/http/token.rs",
    "crates/engine/src/pairing.rs",
    "crates/engine/src/preview.rs",
    "crates/engine/src/record.rs",
    "crates/engine/src/session.rs",
    "crates/engine/src/settle.rs",
    "crates/engine/src/store.rs",
    "crates/engine/src/sweep.rs",
    "crates/imaging/src/avi.rs",
    "crates/imaging/src/avi/read.rs",
    "crates/imaging/src/avi/write.rs",
    "crates/imaging/src/metrics.rs",
    "crates/imaging/src/video.rs",
    "crates/imaging/src/y4m.rs",
]

# AGENTS.md rule 2: "Mutations verify at workspace scope." A mutant that only the
# mutated crate's own unit tests catch is a weaker result than this repo claims, and a
# mutant that only an integration test in `crates/cli` catches is still caught. The
# workspace suite is 625 tests in ~3s, so the honest option is also the cheap one.
test_workspace = true

# nextest is what `just ci` runs, so it is what the floor runs. Anything else would let
# the mutation result and the CI result disagree about which tests exist.
test_tool = "nextest"

# `--locked` everywhere (AGENTS.md, "Docs and dependencies") and offline by construction,
# like `just ci`. The build directory is a copy of this tree; the lockfile travels with it.
additional_cargo_args = ["--locked", "--offline"]

# Do NOT copy `target/` into the build directories, and do not let the build directories
# write into ours. The two trees must not share a target dir: a test binary caches
# `CARGO_MANIFEST_DIR` from wherever it was compiled, and this repo's corpus loader walks
# ancestors of that path looking for `corpus/profiles` (crates/testkit/src/corpus.rs), so
# a binary built in a scratch tree and cached into ours fails every corpus test with
# "no ancestor directory contains corpus/profiles" — a failure that looks exactly like a
# real defect and is not. Observed during P3f. `false` is also cargo-mutants' default;
# it is written out because the default is the load-bearing part.
copy_target = false

# The corpus travels because it is committed and `gitignore = true` only skips ignored
# files — but `.git` itself does not, and nothing in the suite shells out to git.
copy_vcs = false

# The test timeout is pinned, because the autoset one makes the verdict depend on how
# loaded the machine was.
#
# cargo-mutants times each mutant's test run at `baseline x timeout_multiplier`, floored by
# `minimum_test_timeout` — whose default is 20s, and which is what this workspace was
# actually running under, because the baseline suite takes about 3s and 3x5 is below the
# floor. The baseline is measured **once, alone**; every mutant afterwards runs against
# `jobs - 1` concurrent cargo builds on the same disk. Those are not the same conditions,
# and the gap between them grows with every test the workspace adds.
#
# Measured on this machine, same tree, same commit, one variable changed (note N52):
#
#   8 jobs, 20s floor:  34 timeouts -> 42 survivors -> FAIL, 31 with no acceptance
#   4 jobs, 180s floor:  0 timeouts -> 11 survivors -> PASS, register clean both ways
#
# Every one of those 31 was in `imaging/src/metrics.rs` and every one of them was killed
# when given time to finish. So the job reported thirty-one missing tests that were not
# missing — the exact inverse of the failure this floor exists to catch, and the more
# dangerous direction to leave unfixed, because a gate that cries wolf gets re-run with
# `-j1` until it agrees rather than believed.
#
# 180s is chosen against the *slow* side: a real hang now costs three minutes instead of
# twenty seconds, which is affordable in a job that already runs for half an hour, and
# `scripts/mutants.sh` still counts a timeout as a survivor, so the mechanism that catches
# an infinite-loop mutant is untouched — it just stops firing on healthy ones.
minimum_test_timeout = 180.0

# The report lands in `target/mutants.out/`, not at the repository root.
#
# A run leaves a per-mutant log, a diff and a build transcript — hundreds of files. Two
# gates walk the whole tree (`no-frame-bytes-in-repo.sh` content-sniffs every file in it,
# and `gates/lib.sh`'s `gate_scratch_tree` tars a copy of it for each failing selftest
# arm), and both prune `target/`. Leaving the report at the root would put a regenerable
# build artifact into every one of those walks and copies, which is `just ci` paying for a
# rung it does not run. The durable half of a run is committed
# (`scripts/mutants-accepted.txt` and the notes entry); this directory is not.
output = "target"
