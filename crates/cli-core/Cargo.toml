[package]
name = "webcam-handler-cli-core"
description = "The one webcam-handler command surface (T4): clap tree, argument types, rendering, and the executor trait both CLIs implement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "cli_core"

[lints]
workspace = true


[dependencies]
camino.workspace = true
clap.workspace = true
comfy-table.workspace = true
# `record --duration 10s`, which is design §2.7's "humantime durations" arriving at the one
# flag that is a duration a person reasons about (note **N113** carries the rule that decides
# which flags take one and which stay integer milliseconds). The crate was pinned in
# `[workspace.dependencies]` at design time and nothing depended on it until now, so adopting
# it moves `Cargo.lock` and nothing else. MIT OR Apache-2.0, both already on cargo-deny's
# allowlist; it pulls in no transitive package of its own.
humantime.workspace = true
# The sweep progress bar (T4: indicatif for sweeps). It draws to standard error and hides
# itself when that is not a terminal, so a piped `--json` answer stays a document.
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
# A session is named by its UUIDv7 on the command line (`calibrate apply --session`), which
# is the only way to reach one recorded against another camera.
uuid.workspace = true
# `photo diff`'s two halves: `imaging::compare::read` decodes a file this build wrote and
# `imaging::compare::photos` measures the pair (D17). A **document verb runs below the
# executor** (design §2.7), so the comparison has to be reachable from the shared command
# surface itself rather than from either root — an edge to the engine would put the verb in
# one of the two binaries, and this crate's other consumer is the one that links no engine.
# The wall this edge does not cross is the one `scripts/gates/dependency-walls.sh` names:
# `webcam-handler-imaging` sits on that gate's *pure* list beside this crate, so a client
# that links it still links no backend, no engine and no async runtime.
webcam-handler-imaging.workspace = true
webcam-handler-schema.workspace = true

[dev-dependencies]
tempfile.workspace = true
