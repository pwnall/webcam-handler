[package]
name = "webcam-handler-v4l2"
description = "The webcam-handler V4L2 backend: sysfs enumeration, the raw QUERY_EXT_CTRL control layer, mmap streaming, and uevent hotplug."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "v4l2"

[lints]
workspace = true

[dependencies]
# Default features ONLY: the `libv4l` feature links LGPL libv4l (design §2.8).
v4l.workspace = true

# `v4l` is declared before the ioctl layer that uses it (P1), because it is the only
# thing putting the crate in the graph for `feature-posture.sh` to check — that gate
# exists to keep the LGPL `libv4l` feature off, and it cannot check a crate nobody
# depends on. Drop the ignore when src/sys/ lands.
[package.metadata.cargo-machete]
ignored = ["v4l"]
