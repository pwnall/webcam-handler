[package]
name = "webcam-handler-v4l2"
description = "The webcam-handler V4L2 backend: sysfs enumeration, the raw QUERY_EXT_CTRL control layer, mmap streaming, and uevent hotplug."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "v4l2"

[lints]
workspace = true

[dependencies]
camino.workspace = true
# The uevent packet *parser*, and nothing else: the socket, the bind, the group choice
# and the read loop are ours (design §2.5, and `src/sys/uevent.rs`'s header says which
# half is which). Its `netlink-sys` edge is a dev-dependency of that crate, so nothing
# of it ships here.
kobject-uevent.workspace = true
libc.workspace = true
# `net`, and only `net`: the `NETLINK_KOBJECT_UEVENT` socket, its `bind` and its `recv`.
# A safe wrapper whose `sockaddr_nl` is bindgen output, which is why the hotplug edge adds
# no `unsafe` block. The bounded `poll` *under* the socket is **not** rustix's — it is the
# one `libc::poll` block in `src/sys/wait.rs`, which P4d generalised rather than replaced,
# and it is registered as a row in `src/sys/mod.rs`. `event` was enabled here for a while
# on the strength of that misreading and read by nothing; features unify across the build
# graph, so an unused one is compiled for the daemon too.
rustix = { workspace = true, features = ["net"] }
# Default features ONLY: the `libv4l` feature links LGPL libv4l (design §2.8).
v4l.workspace = true
webcam-handler-schema.workspace = true

[dev-dependencies]
# The R3 photo arm decodes its own output rather than trusting the magic bytes, and writes
# it to a scratch directory rather than into the tree (rubric A12).
image.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# A session's identity is a UUIDv7 the caller supplies (the engine reads no clock), so the
# R2 sweep arm mints one the way a composition root would.
uuid.workspace = true
webcam-handler-engine.workspace = true
# The R2 sweep arm asks *this build* which source formats it can decode (D6's closed set)
# rather than keeping a second copy of the list beside the one that answers.
webcam-handler-imaging.workspace = true
webcam-handler-testkit.workspace = true
