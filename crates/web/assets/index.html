<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webcam-handler</title>
    <!--
      The stylesheet and the module graph are ordinary subresources, which they could not
      be until 2026-08-12: the token rides the document's URL (D11) and a browser does not
      carry a query string over to the subresources a document asks for, so every one of
      them was fetched with no credential and the gate refused it — correctly (note N76).
      The owner then ruled that these files are open-source code rather than a secret and
      are served unauthenticated; only the WebSocket and the MJPEG preview stay behind the
      token (note N82, D11's amendment). So this page is a page and app.js is a module,
      with no bundler, no inlining and no second credential form between them.

      `type="module"` is load-bearing rather than modern: a classic script may not
      `import`, so a document that named app.js without it would fetch every module in
      this directory and run none of them.
    -->
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!--
      The operator's workbench (design D20). The owner's session at the start of a
      development run is *tuning* — eyes on the preview, hands on the controls — and the
      shape that serves it is two panes that scroll independently: the preview stays put
      while the control column moves under it, so the picture and the control being
      adjusted are visible at the same time at every scroll position.

      What this replaced was four stacked sections in one scrolling document. It was not
      wrong, it was a *viewer*: at the rung's pinned 1440x900 the page ran to 3359px, the
      control panel began 828px down and ran 2395px, and adjusting anything at all meant
      scrolling the preview off the screen. The measurement is in note **N262**.
    -->
    <header>
      <h1>webcam-handler</h1>
      <p id="connection" class="status">connecting…</p>
    </header>

    <main class="workbench">
      <!--
        Every region below is filled by a module and empty here. The alternative — markup
        that shows a plausible camera and a plausible control until the daemon answers —
        is a page that lies for as long as it takes a socket to open, on a document whose
        whole subject is what a device actually reports (D2, AGENTS rule 4).
      -->
      <section id="stage" class="pane pane-preview" aria-labelledby="stage-heading">
        <h2 id="stage-heading" class="visually-hidden">Camera and preview</h2>

        <div id="cameras" class="picker">
          <ul id="camera-list" class="cameras"></ul>
          <ul id="camera-hints" class="hints"></ul>
        </div>

        <figure class="live">
          <!--
            The `<img>` has no `src` until a camera is chosen, and it is set from
            preview.js rather than written here: the URL carries the credential the page
            was opened with, and a credential does not belong in a file this daemon
            serves to anybody who asks (note N82).
          -->
          <img id="preview-frame" alt="" />
          <figcaption id="preview-status" class="status"></figcaption>
          <!--
            **During a sweep the pane becomes the sweep** (D20). The preview is ended before
            `calibrate_sweep` — a sweep is minutes of exclusive capture and whichever streaming
            operation asks second meets `Busy` (note N83, E16) — so this is what fills the slot
            while it is gone: progress off the live subscription, and the freshest sample
            rendered through `/session-photo` as each one lands. Not a live view of the camera,
            which would show the settle transients between samples; what the operator is
            judging is the samples.

            Two elements rather than one, for the reason the two status lines below have: two
            views sharing one node overwrite each other within milliseconds and the loser is
            whichever wrote first. `hidden` here rather than absent, because calibrate-flow.js
            hands the pane back on every ending a sweep has, refusals included.
          -->
          <div id="sweep-view" class="sweep-view" hidden>
            <img id="sweep-sample" alt="" />
            <p id="sweep-progress" class="status"></p>
          </div>
          <!--
            A second line rather than a second writer of the one above, and P5d's browser
            rung is why that distinction is written down: two views sharing one element
            overwrite each other within milliseconds, and the loser is whichever wrote
            first (see #sweep-status below). These two have different lifetimes — the
            caption is written by the `<img>`'s own load and error events, and this one by
            a poll loop the socket owns — so they are two elements. recording.js is its
            only writer.
          -->
          <p id="recording-status" class="status"></p>
        </figure>

        <!--
          The photograph a person takes to look at is its own slot, below the live figure,
          because the two answer different questions: this one is a shot an operator asked
          for and kept, and the figure above is whatever the camera is doing now — which
          during a sweep is #sweep-view's business.
        -->
        <div class="capture">
          <button id="take-photo" type="button" disabled>Take a photo</button>
          <p id="photo-status" class="status"></p>
          <figure class="shot">
            <img id="photo-frame" alt="" />
            <figcaption id="photo-report" class="report"></figcaption>
          </figure>
        </div>
      </section>

      <!--
        The column that scrolls. Its own scroll container rather than the document's, so
        that reaching the last of a 77-control panel moves nothing in the pane beside it —
        which is the claim the browser rung asserts at the pinned viewport over the vivid
        profile, the widest committed control set this project has met.
      -->
      <div id="column" class="pane pane-controls">
        <section id="controls" aria-labelledby="controls-heading">
          <h2 id="controls-heading">Controls</h2>
          <p class="status">
            <label>
              <input id="guarded" type="checkbox" checked />
              switch automation off first (D3)
            </label>
          </p>
          <p id="controls-status" class="status"></p>
          <div id="control-panel" class="panel"></div>
        </section>

        <section id="calibration" aria-labelledby="calibration-heading">
          <h2 id="calibration-heading">Calibration</h2>

          <!--
            The flow the owner asked for (D20): start, plan, sweep, review the photographs,
            pick one by eye, apply, put the camera back. Every button below sends one of the
            eight `wch_calibrate_*` verbs the daemon already had — the page adds no state
            machine of its own, and an out-of-order click is *meant* to reach the daemon and
            come back as the refusal an operator can read.
          -->
          <div id="flow" class="flow" data-sweeping="false" data-session="">
            <div class="flow-start">
              <label>Task <input id="flow-task" type="text" placeholder="dut-display" /></label>
              <label>Goal <input id="flow-goal" type="text" placeholder="text legible on the DUT display" /></label>
              <!--
                What the operator is judging against, one per line and in priority order —
                `schema::session::Session::criteria` is an ordered list and `calibrate start
                --criterion` is repeatable, so lines are the same grammar with a different
                keyboard. D20 says goal *and criteria* are set at start, and D8 records them
                because the selector needs them; the one surface built for the human selector
                is the last one that should be unable to say what the human is judging.
              -->
              <label>Criteria
                <textarea id="flow-criteria" rows="2" placeholder="one per line, most important first"></textarea>
              </label>
              <!--
                What a click on "Sweep next" costs, in photographs. A sweep is minutes (D8) and
                `SweepSpec::All` is 256 shots on an ordinary control — the right default for a
                command somebody typed, the wrong one for a button.
              -->
              <label>Samples <input id="flow-samples" type="number" min="2" max="256" value="8" /></label>
            </div>
            <div class="flow-buttons">
              <button id="flow-start" type="button" disabled>Start</button>
              <button id="flow-plan" type="button" disabled>Plan</button>
              <button id="flow-sweep" type="button" disabled>Sweep next</button>
              <button id="flow-apply" type="button" disabled>Apply</button>
              <button id="flow-restore" type="button" disabled>Restore</button>
            </div>
            <p id="flow-status" class="status"></p>
            <!--
              The samples of the control under review, each one clickable. Selecting is
              `selector: human` — D8 reserved that word for a reviewer with eyes on the
              photographs, and until this grid existed nothing in this project produced one.
            -->
            <div id="flow-grid" class="samples"></div>
          </div>

          <!--
            Two status lines, because there are two independent things to be wrong about and
            they were sharing one until the browser rung looked (P5d). `#calibration-status`
            belongs to the session *list*, which is re-read on every camera switch;
            `#sweep-status` belongs to the live sweep *subscription*, which is opened once at
            startup and outlives every switch. With one element between them the list's line
            was written milliseconds after the subscription's and overwrote it — so "the
            daemon refused a sweep subscription" and "the sweep stream ended" were both
            replaced by "no calibration sessions recorded for this camera", and a calibration
            view that had silently stopped being live looked exactly like a healthy one.
          -->
          <p id="calibration-status" class="status"></p>
          <ul id="session-list" class="sessions"></ul>
          <div id="session-detail" class="session"></div>
          <p id="sweep-status" class="status"></p>
          <ol id="sweep-log" class="sweep"></ol>
        </section>
      </div>
    </main>
  </body>
</html>
