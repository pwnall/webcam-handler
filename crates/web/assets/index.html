<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webcam-handler</title>
    <!--
      The stylesheet and the module graph are ordinary subresources, which they could not
      be until 2026-08-12: the token rides the document's URL (D11) and a browser does not
      carry a query string over to the subresources a document asks for, so every one of
      them was fetched with no credential and the gate refused it — correctly (note N76).
      The owner then ruled that these files are open-source code rather than a secret and
      are served unauthenticated; only the WebSocket and the MJPEG preview stay behind the
      token (note N82, D11's amendment). So this page is a page and app.js is a module,
      with no bundler, no inlining and no second credential form between them.

      `type="module"` is load-bearing rather than modern: a classic script may not
      `import`, so a document that named app.js without it would fetch every module in
      this directory and run none of them.
    -->
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>webcam-handler</h1>
      <p id="connection" class="status">connecting…</p>
    </header>

    <main>
      <!--
        Every region below is filled by a module and empty here. The alternative — markup
        that shows a plausible camera and a plausible control until the daemon answers —
        is a page that lies for as long as it takes a socket to open, on a document whose
        whole subject is what a device actually reports (D2, AGENTS rule 4).
      -->
      <section id="cameras" aria-labelledby="cameras-heading">
        <h2 id="cameras-heading">Cameras</h2>
        <ul id="camera-list" class="cameras"></ul>
        <ul id="camera-hints" class="hints"></ul>
      </section>

      <section id="stage" aria-labelledby="stage-heading">
        <h2 id="stage-heading">Preview</h2>
        <div class="stage">
          <figure class="live">
            <!--
              The `<img>` has no `src` until a camera is chosen, and it is set from
              preview.js rather than written here: the URL carries the credential the page
              was opened with, and a credential does not belong in a file this daemon
              serves to anybody who asks (note N82).
            -->
            <img id="preview-frame" alt="" />
            <figcaption id="preview-status" class="status"></figcaption>
          </figure>
          <div class="capture">
            <button id="take-photo" type="button" disabled>Take a photo</button>
            <p id="photo-status" class="status"></p>
            <figure class="shot">
              <img id="photo-frame" alt="" />
              <figcaption id="photo-report" class="report"></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section id="controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading">Controls</h2>
        <p class="status">
          <label>
            <input id="guarded" type="checkbox" checked />
            switch automation off first (D3)
          </label>
        </p>
        <p id="controls-status" class="status"></p>
        <div id="control-panel" class="panel"></div>
      </section>

      <section id="calibration" aria-labelledby="calibration-heading">
        <h2 id="calibration-heading">Calibration</h2>
        <p id="calibration-status" class="status"></p>
        <ul id="session-list" class="sessions"></ul>
        <div id="session-detail" class="session"></div>
        <ol id="sweep-log" class="sweep"></ol>
      </section>
    </main>
  </body>
</html>
