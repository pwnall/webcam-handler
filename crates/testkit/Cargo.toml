[package]
name = "webcam-handler-testkit"
description = "Dev-only test kit: the backend conformance battery, the device-profile corpus loader, synthetic image fixtures, and container oracles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "testkit"

[lints]
workspace = true

[dependencies]
camino.workspace = true
# `image::GrayImage` is the type the imaging crate's fixture generators speak in; naming
# it is the whole of this crate's use of the dependency (`images` re-exports the rest).
image.workspace = true
serde_json.workspace = true
# **The sweep planner and nothing else** (`engine::sweep::plan`), because
# `battery::sweep_for` prices a hardware arm's sweep from a descriptor *before* the arm
# opens a session, and pricing it any other way would be a second planner with a second
# opinion (design §2.10). Both calibration rungs ask this one function through this one
# crate; note **N72** is what the previous arrangement — the same arithmetic written into
# two `#[ignore]`d test binaries — cost.
#
# This closes a cycle with `webcam-handler-engine`, which dev-depends on this crate for the
# battery. Cargo permits it because the return edge is a dev-dependency and dev-dependencies
# do not link; `dependency-walls.sh` counts only normal edges, and the wall this could have
# touched — "`webcam-handler-client` links no engine" — is unmoved, because the client's edge
# to this crate is a dev one too. `testkit-is-dev-only.sh` is the gate that keeps it that way.
webcam-handler-engine.workspace = true
webcam-handler-imaging.workspace = true
webcam-handler-schema.workspace = true

# The oracle harness's own arms write real files, because both oracles are separate processes
# that take a path — so unlike the muxers this module cannot be exercised against an in-memory
# sink. The directory comes from `engine::paths::scratch_dir`, which is where a temporary file
# has its one home since the 2026-08-12 ruling (note **N84**) and which hands back a
# `tempfile::TempDir`; this edge is what lets the type be named. A `tempfile::tempdir()` call of
# this crate's own would be the thing `scripts/gates/scratch-has-one-home.sh` bans.
[dev-dependencies]
tempfile.workspace = true
