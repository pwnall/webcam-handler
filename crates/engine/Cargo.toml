[package]
name = "webcam-handler-engine"
description = "The webcam-handler engine: camera actors, guarded writes, snapshot/restore, capture orchestration, calibration, and the session store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "engine"

[lints]
workspace = true

# P0 lands the pure cores only, so the dependency list is the pure cores' list. The
# imperative shell's dependencies (fd-lock and tempfile for the one atomic-write path,
# jiff, tracing, webcam-handler-imaging for per-sample scoring) arrive with the code that
# reads them — `cargo machete` is part of `just ci`, and a dependency nobody uses is the
# same defect as a constant nobody reads (rubric A8).
[dependencies]
camino.workspace = true
serde_json.workspace = true
uuid.workspace = true
webcam-handler-schema.workspace = true

