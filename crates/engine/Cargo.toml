[package]
name = "webcam-handler-engine"
description = "The webcam-handler engine: camera actors, guarded writes, snapshot/restore, capture orchestration, calibration, and the session store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "engine"

[lints]
workspace = true

# The shell's dependencies arrive with the code that reads them — `cargo machete` is part
# of `just ci`, and a dependency nobody uses is the same defect as a constant nobody reads
# (rubric A8). P2 adds `webcam-handler-imaging`, which the photo pipeline calls; P3a adds
# fd-lock (D9's one advisory lock) and tempfile (the in-directory temp file
# `write_json_atomic` renames over its destination). `tempfile` is a normal dependency
# rather than a dev one because `store::TempStore` — the §2.9 double other crates' tests
# consume — ships with the library. tracing still waits for the daemon (P4).
[dependencies]
camino.workspace = true
fd-lock.workspace = true
# `geteuid`, for D9's state-directory check: N39's ruling has two halves and the second one
# is "who owns it" (note **N150**). **`rustix` and not `libc`** for the reason
# `webcam-handler-daemon`'s own dependency note gives — this crate is `#![forbid(unsafe_code)]`
# and rustix is a safe wrapper — and it is already a workspace dependency at a pinned version,
# so this is an edge rather than an adoption. `process` only: no filesystem, no net.
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
webcam-handler-imaging.workspace = true
webcam-handler-schema.workspace = true

# A dev-dependency on a backend is legal where a normal one would not be:
# `scripts/gates/dependency-walls.sh` counts shipping edges, and a test binary ships
# nowhere. The fake is how the engine's own tests get a device that behaves like one.
[dev-dependencies]
kamadak-exif.workspace = true
webcam-handler-fake.workspace = true
webcam-handler-testkit.workspace = true

