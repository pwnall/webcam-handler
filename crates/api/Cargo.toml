[package]
name = "webcam-handler-api"
description = "The one webcam-handler wire surface: the jsonrpsee RPC trait over schema DTOs plus the error-code registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "api"

[lints]
workspace = true

[dependencies]
jsonrpsee = { workspace = true, features = ["macros", "client-core", "server-core"] }

# `jsonrpsee` is declared before the T5 trait that uses it (P4), because it is what
# makes `dependency-walls.sh`'s wire-crate wall a live check rather than a vacuous
# one: it is the edge that drags tokio in, which is the whole subject of note N5.
# Drop the ignore when src/ actually names it.
[package.metadata.cargo-machete]
ignored = ["jsonrpsee"]
