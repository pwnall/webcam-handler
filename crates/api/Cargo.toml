[package]
name = "webcam-handler-api"
description = "The one webcam-handler wire surface: the jsonrpsee RPC trait over schema DTOs plus the error-code registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "api"

[lints]
workspace = true

[dependencies]
# The transport encoding, and the one crate in the workspace that may name it: design
# D10 puts base64-in-JSON here, and `webcam-handler-schema`'s `PhotoDelivery` doc comment
# says so from the other side ("carrying an unused encoding here would be a dependency
# nobody reads").
base64.workspace = true
jsonrpsee = { workspace = true, features = ["macros", "client-core", "server-core"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
webcam-handler-schema.workspace = true
