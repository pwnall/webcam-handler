[package]
name = "webcam-handler-cli"
description = "The direct webcam-handler CLI, driving the engine in-process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "webcam-handler-cli"
path = "src/main.rs"

[lints]
workspace = true


[dependencies]
camino.workspace = true
# No clap: `Cli::parse_checked` lives in the shared command surface, because the rule it
# enforces beyond clap's own attributes has to hold for `webcam-handler-client` too (T4).
serde_json.workspace = true
# A session's identity is a UUIDv7 the *caller* mints: the engine reads no clock, so the
# composition root is where "now" enters (design D9).
uuid.workspace = true
webcam-handler-cli-core.workspace = true
webcam-handler-engine.workspace = true
webcam-handler-fake.workspace = true
webcam-handler-schema.workspace = true
webcam-handler-v4l2.workspace = true

[dev-dependencies]
# The photo suite reads its own EXIF back with an implementation that shares no code with
# the writer (docs/9: write-only EXIF is a defect class), and decodes its own output rather
# than trusting the magic bytes.
image.workspace = true
kamadak-exif.workspace = true
# The recording suite re-parses the AVI the binary just wrote with `imaging::avi::read` —
# the strict reader P6a wrote from the RIFF/AVI specification before the muxer existed and
# which shares no code with it (docs/7 P6a: "an independent re-parse path that is **not** the
# writer's code"). A hand-rolled chunk walk in this file would be a third parser to keep
# current, and one that agrees with whatever it was written against.
webcam-handler-imaging.workspace = true
serde_json.workspace = true
tempfile.workspace = true
