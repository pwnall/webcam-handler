[package]
name = "webcam-handler-daemon"
description = "wchd — the webcam-handler daemon: JSON-RPC over a Unix socket always, opt-in loopback TCP with a bearer token for the web client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "daemon"

[[bin]]
name = "wchd"
path = "src/main.rs"

[lints]
workspace = true

# Arriving with the code that reads them, as everywhere else in this workspace — a
# dependency nobody uses is the defect a constant nobody reads is (rubric A8), and
# `cargo machete --with-metadata` is part of `just ci`. Design §2.8's inventory for this
# crate also lists axum, tower-http and rust-embed (P5's web listener): axum arrives here at
# P5a with `daemon::http::listener`, rust-embed arrives one crate along in
# `webcam-handler-web` — which is what this crate depends on instead, so the embed has one
# reader — and **tower-http is still not here**, because the thing that reads it is P5b's
# `CompressionLayer` and the preview route it has to be excluded from. Its other three —
# sd-notify, listenfd and tracing-journald — arrived with P4e-ii's second half, and
# `daemon::systemd` is what reads all three.
#
# `jsonrpsee-server` rather than `jsonrpsee`'s `server` feature, and that is not a style
# choice — note N38 has the measurement. `webcam-handler-api` depends on the facade, and
# `cargo metadata` resolves features once per package for the whole workspace, so a
# `jsonrpsee/server` enabled here would make `api` reach hyper and take down the T6 wall
# `dependency-walls.sh` asserts. The pin is the same release train (0.26.0), and
# `RpcModule` is `jsonrpsee-core`'s type either way, so the trait the daemon mounts is the
# same type this crate serves.
[dependencies]
# The opt-in TCP transport D11 describes: the embedded client, the token gate over every
# route of it, and the graceful stop the daemon's own token drives (`daemon::http`). MIT,
# tokio-rs governance; design §2.8 pinned it at 0.8 and §7 records what it was chosen over
# (actix-web, warp, poem, rouille, tiny_http, and hand-rolling JSON-RPC over it).
#
# **Two features, and they are minimal in the strong sense: `axum::serve` does not exist
# without both.** The `serve` module is `#[cfg(all(feature = "tokio", any(feature = "http1",
# feature = "http2")))]` — `tokio` is what lets a `tokio::net::TcpListener` be served on and
# `http1` is the protocol a browser speaks to a loopback socket, so this pair is the smaller
# of the two ways to satisfy that predicate.
#
# What the default set would have added, each off for a reason rather than for being small:
# `json`, because this daemon's JSON is jsonrpsee's and a second codec on the wire surface
# would be a second answer to D10; `form` and `query`, because the gate parses the query
# string itself — "what does a request carrying two `token=` parameters present" is a
# security decision and `Query`'s deserializer answers it quietly (`daemon::http::gate` has
# the argument); `matched-path` and `original-uri`, which exist for middleware that branches
# on what it matched, and this gate deliberately branches on nothing; `tower-log` and
# `tracing`, which are axum's own logging, where this daemon's is `daemon::logging`'s one
# decision. `http2` is off because nothing reaches this listener but a browser on a socket
# D11 defaults to loopback, and `ws` is P5b's — it arrives with the endpoint that reads it
# (rubric A8).
axum = { workspace = true, features = ["http1", "tokio"] }
camino.workspace = true
# The composition root's two flags, in the workspace's one argument parser. `wchd` links
# no `cli-core`: T4 is the *command* surface `wch` and `wchc` share, and the daemon has no
# verbs — what it has is a backend to choose (design §2.11's second factory match) and,
# from P5, a listener to open.
clap = { workspace = true, features = ["derive"] }
# The facade, for `jsonrpsee::core::async_trait` — the attribute the generated
# `WchRpcServer` trait is declared with, so the daemon's impl has to use the same one.
# `server-core` and nothing else: it is the feature `webcam-handler-api` already enables,
# so this edge adds no feature to the shared `jsonrpsee` node (note N38).
jsonrpsee = { workspace = true, features = ["server-core"] }
jsonrpsee-server.workspace = true
# Socket activation: the `LISTEN_FDS`/`LISTEN_PID` protocol, read once from the composition
# root (`daemon::systemd::Activation`). Twenty lines of protocol we could have written, taken
# as a dependency for the half that is not the protocol — `take_unix_listener` validates that
# the descriptor systemd handed us really is a listening `AF_UNIX` stream socket before it
# builds a `UnixListener` over it, which is the check that stops `from_raw_fd` on a passed-in
# number being a lie this process then serves from. Apache-2.0. Its `libc` edge is its own:
# this crate stays `#![forbid(unsafe_code)]` and adds no `libc` edge of its own (`rustix` is
# the workspace's answer for that, note N39).
listenfd.workspace = true
# The `*at` family and `geteuid`, for note N39's socket-directory hardening: the directory
# is held as a descriptor, `fstat`ed, and the socket bound relative to it, so what was
# checked and what is served from are provably one inode rather than one name. `fs` for
# `openat`/`fstat`/`statat`/`mkdirat`/`unlinkat`, `net` for `socket_with`/`bind`/`listen`
# over `AF_UNIX`, `process` for `geteuid`. **`rustix` and not `libc`** because this crate
# is `#![forbid(unsafe_code)]` and stays that way — rustix is a safe wrapper, so the
# hardening lands without moving the boundary `unsafe-scope.sh` asserts (note N39's
# 2026-08-10 amendment).
#
# `rand` is P5a's, and it is the same argument about a fourth syscall: `getrandom(2)` for
# D11's per-run bearer token (`daemon::http::token`), which must come from the kernel's
# CSPRNG and must not cost this crate an `unsafe` block or a second answer to "how does
# this workspace reach the kernel" (design §2.10). It is a **feature on a pin the
# workspace already carries**, not an adoption: rustix declares it as `rand = []`, so it
# enables no optional dependency and adds no package to the resolved graph.
rustix = { workspace = true, features = ["fs", "net", "process", "rand"] }
# `READY=1`, `STATUS=…`, `STOPPING=1` and `WATCHDOG=1` on `$NOTIFY_SOCKET` — the real
# implementation of the [`daemon::shutdown::Notifying`] seam P4e-ii's first half shipped as a
# trait (note **N58**'s split). **Pure Rust, no libsystemd**, which design §2.6 requires of
# the whole systemd half; MIT OR Apache-2.0. Default features: `fdstore` is the only optional
# one and it would add `sendfd` for a descriptor-store this daemon does not use. Its `notify`
# is a no-op when `$NOTIFY_SOCKET` is unset, which is what lets `daemon::systemd::Supervisor`
# run unconditionally rather than behind a "are we under systemd" guess.
sd-notify.workspace = true
# One `#[derive(Serialize)]`: the payload a lag close carries back to the subscriber that
# lagged (`crate::events`). jsonrpsee's blanket `impl<T: ToString> From<T> for
# SubscriptionError` would flatten that count into prose a client has to parse, and the
# whole reason to name it is that a client can act on it. No `serde_json` edge — the
# `to_json_raw_value` that renders it is jsonrpsee's own re-export.
serde = { workspace = true, features = ["derive"] }
# `net` for `UnixListener`, `macros` for `select!` and `#[tokio::main]`, `sync` for the
# `oneshot` a request hands to a camera actor, `time` for the idle-sweep cadence and the
# shutdown drain's `timeout`, and the multi-threaded runtime because a connection task and
# the accept loop are concurrent by construction. `signal` is P4e-ii's: the daemon registers
# SIGTERM and SIGINT and treats them as one request (`daemon::shutdown`), where before it took
# the kernel's default disposition and could not drain at all.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# `CancellationToken`, which is the whole of this edge: one stop token, cloned to every open
# subscription and to the idle-sweep driver (`daemon::shutdown::Shutdown`). **It carries no
# feature**, deliberately and stated because the neighbouring dev-dependency does: `sync` is
# unconditional in tokio-util 0.7.19's `src/lib.rs`, so the token needs nothing enabled, while
# `tests/support/ws.rs` needs `compat` to bridge a `tokio::net::UnixStream` onto the
# `futures::io` traits soketto takes. Same package, same pin, two entries — the dev one adds
# the feature, this one must not, because a feature enabled on a normal edge is enabled for
# every build of the workspace.
tokio-util.workspace = true
tracing.workspace = true
# Design §2.6's journald layer, "pure-Rust protocol, no libsystemd" — which is this crate
# rather than the `systemd` bindings, and is why the requirement is met by a dependency
# instead of by a feature flag on one. MIT. Installed **instead of** the fmt layer when
# `$JOURNAL_STREAM` says stderr already is the journal, because both would write every line
# twice; `daemon::logging` is where that decision lives and `daemon::systemd` is where the
# comparison that makes it is a pure function.
tracing-journald.workspace = true
# `env-filter` so an operator can raise the level with `RUST_LOG` on a process that is
# meant to keep running. The layer the filter sits over is now one of two — fmt on a
# terminal, journald under systemd — which is `daemon::logging`'s decision to make.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# A session's identity is a UUIDv7 the *caller* mints: the engine reads no clock, so the
# composition root is where "now" enters (design D9). Promoted from a dev-dependency when
# P4c routed `wch_calibrate_start`, which is the same reason `crates/cli` carries it — the
# two roots that can open a session are the two that mint an id.
uuid.workspace = true
webcam-handler-api.workspace = true
webcam-handler-engine.workspace = true
webcam-handler-fake.workspace = true
webcam-handler-schema.workspace = true
webcam-handler-v4l2.workspace = true
# The client's files, embedded (design §2.7's "assets embed"). This crate depends on the
# asset crate and **not on `rust-embed`**: what a path holds is that crate's law and how
# bytes become an HTTP response is this one's (design §2.10), so the embed machinery has one
# home and one reader, and `daemon::http::listener` needs no derive and no trait in scope to
# serve a page.
webcam-handler-web.workspace = true

[dev-dependencies]
# `client-core` is the generated T5 client's supertrait (`ClientT`): the read-verb suite
# drives the daemon through `api::WchRpcClient` rather than through hand-built JSON, so
# the request the server parses is the one a real client sends. It is not `wchc`'s
# transport — that is P4f's ~200 lines — and it adds no feature the workspace's shared
# `jsonrpsee` node did not already carry.
jsonrpsee = { workspace = true, features = ["client-core"] }
serde_json.workspace = true
# A real WebSocket upgrade on the daemon's own socket, for `tests/subscriptions.rs` and
# `tests/signals.rs`: the
# generated T5 *client* cannot carry a subscription — `SubscriptionClientT::subscribe`
# answers a type whose only constructor is private to `jsonrpsee-core`, so no transport of
# ours can implement it (note **N57**) — and `support/mod.rs`'s one-shot HTTP `POST` cannot
# carry a duplex stream. So the suite speaks the frame layer directly, with
# jsonrpsee-server's own implementation of it. `tokio-util`'s `compat` is what bridges a
# `tokio::net::UnixStream` to the `futures::io` traits soketto takes; both crates are
# already in `Cargo.lock` and neither touches a T6 wall, which counts normal edges only.
soketto.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
# The test client is a hand-written HTTP/1.1 request on a `UnixStream` — see
# `tests/uds.rs` for why that is the honest client here and not a shortcut. The temp-dir
# fixtures it needs are `engine::store::TempStore` and `engine::paths::TempRuntimeDir`,
# which ship with the engine for exactly this, so no second `tempfile` edge.
# `test-util` for tokio's paused clock: the idle-sweep driver is a task on a timer, and
# advancing a paused clock is how a test talks about a deadline without waiting for one —
# the same doctrine `engine::settle`'s stepped clock states, applied to the runtime's own.
tokio = { workspace = true, features = ["io-util", "test-util"] }
webcam-handler-testkit.workspace = true

