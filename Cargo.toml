[workspace]
resolver = "3"
members = [
    "crates/schema",
    "crates/imaging",
    "crates/engine",
    "crates/backends/fake",
    "crates/backends/v4l2",
    "crates/api",
    "crates/cli-core",
    "crates/cli",
    "crates/priv",
    "crates/client",
    "crates/daemon",
    "crates/web",
    "crates/testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV — one fact (rubric B9). `scripts/gates/msrv-sync.sh` asserts every other copy
# (CI workflow, docs) agrees with this line.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwnall/webcam-handler"
authors = ["Victor Costan <victor@costan.us>"]

[workspace.dependencies]
# --- our crates (path deps; versions kept in lockstep) ---
webcam-handler-api = { path = "crates/api", version = "0.1.0" }
webcam-handler-cli-core = { path = "crates/cli-core", version = "0.1.0" }
webcam-handler-engine = { path = "crates/engine", version = "0.1.0" }
webcam-handler-fake = { path = "crates/backends/fake", version = "0.1.0" }
webcam-handler-imaging = { path = "crates/imaging", version = "0.1.0" }
webcam-handler-schema = { path = "crates/schema", version = "0.1.0" }
webcam-handler-testkit = { path = "crates/testkit", version = "0.1.0" }
webcam-handler-v4l2 = { path = "crates/backends/v4l2", version = "0.1.0" }
webcam-handler-web = { path = "crates/web", version = "0.1.0" }

# --- third-party, pinned at adoption (design §2.8) ---
anstream = "1.0.0"
anstyle = "1.0.13"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
# Ambient-capability manipulation for the dev-only `webcam-handler-priv` helper.
# MIT/Apache-2.0.
caps = "0.5.6"
camino = { version = "1.2.5", features = ["serde1"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
# `clap_complete` and `clap_mangen` were pinned here at P0 for an `xtask` that would emit shell
# completions and man pages, and that emitter was never written: `xtask::generate` writes the
# JSON Schema bundle, the OpenRPC document and `docs/agent-guide.md`, and nothing in this
# workspace ever named either crate. They were removed on 2026-08-16 (the G6 review's L32, note
# **N164**). Two lines, and the reason they are worth a paragraph: design §2.8 makes this table
# the dependency registry, so an entry here is a claim about what the product links — and a
# version pinned "at adoption" for a crate that was never adopted is a pin nothing can go stale
# against, since a workspace dependency nobody names does not reach `Cargo.lock` at all.
# `futures-timer` four lines down is the opposite case and the contrast is the rule: it is listed
# because the lock *does* resolve it, transitively, and an adoption visible only in the lock is
# one nobody reviewed. Re-adopting either is a one-line decision the owner's 2026-08-09 ruling
# explicitly says is not an escalation — but it belongs in the commit that writes the emitter.
comfy-table = "8.0.0"
fd-lock = "4.0.4"
# Adopted at P4f with `jsonrpsee/async-client`, which is the only thing that reaches it:
# `jsonrpsee-core`'s async client uses it for the request timeout, and **no crate in this
# workspace names it directly**. It is listed here anyway because design §2.8 makes this
# table the dependency registry, and an adoption that appears only in `Cargo.lock` is an
# adoption nobody reviewed — note N57 declined to pay for exactly this crate at P4e-i ("not
# in `Cargo.lock` and does not resolve offline"), so its arrival is a decision and not an
# accident. MIT OR Apache-2.0, both already on cargo-deny's allowlist; it adds no transitive
# package of its own, which was measured against `webcam-handler-api`'s dependency closure
# before it was taken (`dependency-walls.sh` and `feature-posture.sh` are the standing
# checks). The version is the one the lock resolves; the lock, not this line, is what pins a
# dependency nothing declares.
futures-timer = "3.0.4"
humantime = "2.4.0"
# `default-features = false` is load-bearing: the default feature set drags `avif`,
# which drags the rav1e AV1 encoder (design §2.8; feature-posture.sh gates it).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# D17's SSIM corroborator, adopted at P8b under the owner's 2026-08-09 ruling with the one
# measurement design §2.8 made the condition: its own `image` edge is
# `default-features = false`, so nothing here re-enables the `avif` door that drags rav1e
# through workspace-wide feature unification (`feature-posture.sh` is the standing backstop,
# and note **N260** records the resolved graph this adoption actually adds). MIT.
image-compare = "0.5.0"
imageproc = { version = "0.27.0", default-features = false }
indicatif = "0.18.6"
jiff = "0.2.35"
jsonrpsee = "0.26.0"
# The server half, named as its own package rather than reached through the facade's
# `server` feature — same release train, same pin. Note N38 records the measurement that
# forced it: `cargo metadata` unifies features per package across the workspace, so a
# `jsonrpsee/server` anywhere makes `webcam-handler-api` reach hyper and takes down
# `dependency-walls.sh`'s T6 wall.
jsonrpsee-server = "0.26.0"
kamadak-exif = "0.6.1"
kobject-uevent = "0.2.0"
libc = "0.2.189"
listenfd = "1.0.2"
little_exif = "0.6.23"
png = "0.18.1"
rust-embed = "8.12.0"
# Safe wrappers for the syscalls `std` does not expose: the `NETLINK_KOBJECT_UEVENT`
# socket P4d's hotplug watch binds, and the `*at` family the daemon's socket directory
# needs (note N39). Chosen over `libc` because it is *safe* — the daemon is
# `#![forbid(unsafe_code)]` and must stay that way, and in the V4L2 backend it keeps a
# kernel-facing edge from adding `unsafe` blocks. Already in `Cargo.lock` transitively
# (fd-lock, tempfile, crossterm) and its licence already named on deny.toml's allowlist.
rustix = "1.1.4"
schemars = "1.2.2"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# jsonrpsee-server's *own* WebSocket implementation, already in `Cargo.lock` through it and
# already accepted by cargo-deny (Apache-2.0 OR MIT). A `[dev-dependencies]` entry of
# `webcam-handler-daemon` only: the daemon's subscription suite drives a real upgrade on the
# real `AF_UNIX` socket, and using the server's own frame layer is what keeps the two halves
# of a frame from disagreeing about what a frame is. Not jsonrpsee's client — that would
# want `TransportSenderT`/`TransportReceiverT` impls and buys nothing a frame reader does
# not, and `webcam-handler-client`'s transport is P4f's separate piece by design (§2.6).
soketto = "0.8.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
# `wrappers::ReceiverStream` and nothing else: the MJPEG preview's response body is a
# `tokio::sync::mpsc::Receiver` of already-framed multipart parts, and `axum::body::Body::from_stream`
# takes a `futures_core::TryStream`. Adopted at P5b as the smaller of the two ways to bridge
# them — the other is a direct `futures-core` edge plus a hand-written `poll_next` over
# `Receiver::poll_recv`, which is this crate's `ReceiverStream` copied into our tree. MIT,
# tokio-rs, already in `Cargo.lock` at exactly this version through jsonrpsee, so the edge adds
# no package. `default-features = false` drops its one default (`time`, which is a `StreamExt`
# combinator set this daemon does not use); `wrappers::ReceiverStream` is unconditional.
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = "0.7.19"
# The `Service` trait itself, and the `Identity` layer its builders default to. Adopted at
# P5b for one reason: jsonrpsee's wire surface is handed out as a `tower::Service`
# (`TowerServiceBuilder::build`), and **neither `jsonrpsee-server` nor `axum` re-exports the
# trait** — so a daemon that mounts that service on an axum route has to name `tower` to call
# it. MIT. Already in `Cargo.lock` through both of them at exactly this version, so this
# entry adds no package and no feature to the resolved graph; tower 0.5 declares **no
# `default` feature**, and `Service`, `Layer` and `layer::util::Identity` are unconditional,
# which is why there is no `default-features = false` beside it — there is nothing to turn
# off. It is a `webcam-handler-daemon` edge only, and the daemon is already the one crate
# that links the web stack (design §2.8), so no T6 wall moves: `dependency-walls.sh`'s wire
# wall names `tower-http`, which this is not, and the pure crates name neither.
tower = "0.5.3"
# `CompressionLayer`, over the static assets and deliberately **not** over the MJPEG preview
# (design §2.8 lists it for the daemon; `daemon::http::listener` is where the split is
# composed and argued). MIT.
#
# **The version is 0.6, and design §2.8's table says 0.7.** The table was written before the
# crate was adopted and 0.7 does not exist: 0.6.11 is the current release and the one that
# resolves, so this line is the pin *at adoption*, which is what AGENTS asks for ("versions
# pinned at adoption"). The doc reconciliation is P5b's close, with the notes; recorded here
# rather than silently matched, because a manifest that quietly disagrees with the design
# registry is how the registry stops being one.
#
# One feature, and it is the whole of what is enabled: `compression-gzip`. Gzip because it is
# the one content coding every browser has sent in `accept-encoding` for two decades, so a
# single algorithm costs nothing in coverage; brotli and zstd would each add an encoder crate
# for a few percent on a page measured in kilobytes, and `compression-full` would add all
# three. It brings `async-compression` (gzip → flate2, already in the lock through `image`),
# `http-body`, and tokio-util's `io` — all MIT or MIT/Apache-2.0, all on cargo-deny's
# allowlist.
tower-http = { version = "0.6.11", default-features = false }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
# `v4l` default features ONLY — the `libv4l` feature links LGPL libv4l
# (design §2.8; feature-posture.sh gates it).
v4l = "0.14.0"
y4m = "0.8.0"
yuv = "0.8.17"
zune-jpeg = "0.5.15"

[workspace.lints.rust]
# One obligation per unsafe block, and no implicit unsafe inside unsafe fns
# (design §2.5, rubric B10 [V]).
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
# Suppressions are `#[expect(.., reason = "..")]`, narrowest scope (rubric B11).
# Gates v1 wrote these two under `cfg_attr(not(test), ..)`; a `[workspace.lints]` table
# cannot express cfg, and one home for the lint policy beats one exemption for tests —
# recorded as N1 in docs/implementation-notes.md, absorbed into docs/9 Part 1. The
# effect is strictly stronger.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
# Bindgen + image codecs are unbearable unoptimized; dependencies get -O2, our code
# keeps fast rebuilds.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# ...except that the line above does not do what it says for a crate whose job is calling a
# codec, and `webcam-handler-imaging` is that crate. `image`'s `JpegEncoder::encode_image` is
# generic over the pixel type, so it is **monomorphised into this crate** and compiled at
# *our* opt-level rather than the dependency's — a per-dependency override cannot reach code
# that is instantiated here. Measured on the attached-camera host, one 1280x720 luma frame
# through `imaging::encode::jpeg`: 470 ms at 0, 30 ms at 2, no further gain at 3.
#
# That was not a slow build, it was a **red gate**. `webcam-handler-fake` synthesises each
# frame through this encoder, the default settle takes eleven frames, and eleven times
# 470 ms walks past `DEFAULT_SETTLE_DEADLINE_MS`, so `webcam-handler-cli photo` over the fake
# *failed* — which `json-validates.sh` and `cli-parity.sh` both drive. It was invisible from
# `just ci` because `test` runs before `gates` and `[profile.test]` left a faster binary at
# the same path, so whether the suite passed depended on which profile last wrote
# `target/debug/webcam-handler-cli`. Pinning this crate makes the two profiles agree, which
# is the point: a gate must not be re-runnable only sometimes.
[profile.dev.package.webcam-handler-imaging]
opt-level = 3

[profile.test]
opt-level = 1

# The profile every binary an operator runs is built under, and until 2026-08-17 the one this
# manifest never mentioned (the G6 review's L2, note **N225**). `cargo install --locked --path
# crates/daemon` — the README's install line — builds `--release`, so the three paragraphs above
# describe how this workspace is *developed* and nothing described how it *ships*.
#
# `overflow-checks = true` because the alternative is that the arithmetic under test is not the
# arithmetic that runs. `dev` and `test` both have overflow checks on by default, so every
# assertion this suite makes about a number is an assertion about a build no operator installs;
# cargo's release default is off, and an `i64` that wraps there becomes an answer rather than a
# refusal. This project's whole posture is that a wrong number is worse than a stopped one — a
# device's answer is validated before use, wire integers go through `try_from` and never `as`,
# and D2 forbids inventing a value the device did not give. A wrapped subtraction inside
# `ControlRange::align_down` was measured returning a range's **maximum** for its most negative
# input (note **N224**); on `pan_absolute` that is a motor at its far limit, delivered as a
# success. The panic is the honest outcome of the two.
#
# **What a panic then looks like differs at each of the three roots, and note N238 is the
# statement of it**, because "the checks are on" is only half a shipped-behaviour decision. In
# `webcam-handler-daemon` the camera actor's thread unwinds and the caller is answered
# `DeviceGone` — a *typed* failure, and the wrong type: an arithmetic bug reads to the primary
# consumer as a camera that vanished. In `webcam-handler-cli` and `webcam-handler-client` there is
# no `catch_unwind` at all: the process exits 101, standard output carries no
# `schema::error::Failure`, and the N127/N128 contract is silently not kept. Neither is repaired
# here; both are named there.
#
# **Dependencies stay at cargo's default, and that is a decision rather than an omission.**
# Re-measured 2026-08-17 (the review of B10 could not drive the middle row, so all three were run
# again together): `webcam-handler-cli photo` over the fake with `corpus/profiles/obsbot-tiny3
# .json` — a 4K frame through eleven JPEG encodes, which is the most codec-bound path this
# workspace can run without a camera — release binaries built from three copies of this tree, five
# runs each, taken round-robin so a drift in the machine lands on all three:
#
#     cargo's release default (checks nowhere)   1.91 1.85 1.84 1.86 1.85  (median 1.85 s)
#     checks everywhere, dependencies included   2.18 2.21 2.13 2.27 2.14  (median 2.18 s, +18%)
#     checks on the workspace crates only        1.89 1.84 1.85 1.79 1.80  (median 1.84 s)
#
# Each row's build was verified rather than assumed, with `cargo build --release -v -p
# webcam-handler-cli`: 176 rustc units in that graph, of which 0 carry `-C overflow-checks=on` in
# the first row, 176 in the second and 7 in the third (`schema`, `imaging`, `engine`, `v4l2`,
# `fake`, `cli_core`, `webcam_handler_cli`).
#
# So the whole of the 18% is third-party codec inner loops and none of it is ours. It would also
# be 18% spent shipping a configuration nobody upstream runs: `zune-jpeg` and `image` are tested
# and fuzzed under the semantics they release with, and a decoder that leans on wrapping in a hot
# loop — none of these have been read for it — would turn a malformed frame from a typed refusal
# into a dead process, which is availability-versus-capability inverted at the worst place for it.
#
# **The line is not exact, N116 is why, and the inexactness is now named rather than estimated.**
# A per-package override cannot reach a dependency's generic that *our* code instantiates: a
# monomorphisation is code-generated into the crate that asks for it and takes that crate's flags.
# Read off the release `.rlib`s with `nm -C` rather than guessed at — every dependency symbol
# defined inside a checked workspace unit, 2026-08-17:
#
#     imaging   zune_jpeg::headers::parse_{app1,app2,app13,app14,dqt,huffman,sos,start_of_frame},
#               zune_jpeg::idct::scalar::idct_int_1x1, zune_jpeg::upsampler::upsample_no_op,
#               image::imageops::affine::{flip_horizontal,flip_vertical,rotate90,rotate180,
#               rotate270} over Luma<u8> and Rgb<u8>, png::encoder::write_chunk,
#               imageproc::filter::gaussian_blur_f32
#     schema    serde_json (69), schemars (4)
#     engine    serde_json (8), tempfile (2), serde, getrandom
#     cli_core  serde_json (4), clap_builder (4), serde
#     v4l2      v4l (1)
#
# `image::codecs::jpeg::JpegEncoder::encode_image` is **not** among them, which is worth writing
# down because it was the example this paragraph used to give. What is among them is better for
# the argument than the guess was: the malformed-frame surface — `zune_jpeg`'s eight header
# parsers — is on the *checked* side, which is where a wrapped length wants to be. What is left
# outside is the decoder's inner loops, which is exactly what the third row prices at nothing.
#
# Nothing else here departs from cargo's release defaults. `lto`, `codegen-units` and `panic` are
# performance and behaviour decisions with no finding behind them, and this table exists because
# the shipped profile must be visible, not so that it can accumulate.
[profile.release]
overflow-checks = true

[profile.release.package."*"]
overflow-checks = false
