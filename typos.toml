[files]
extend-exclude = [
    "Cargo.lock",
    "vendor/",
    "corpus/",
    "docs/research/",
]

[default]
# An abbreviated sha256 in an evidence transcript. `1385ba86…8a9c2004` carries a `ba`, which
# reads as a misspelt "by", and the two-character repair that would silence it is an edited
# measurement — `Inh` below is in this file for the same reason. Matched by *shape* rather
# than by listing the digests that exist today, so recording the next transcript costs no
# config edit: two hex runs either side of the ellipsis this project abbreviates with, which
# is a spelling no English word has.
extend-ignore-re = ["[0-9a-f]{6,}…[0-9a-f]{6,}"]

[default.extend-words]
# V4L2 / UVC vocabulary that reads as a typo.
GREY = "GREY"
grey = "grey"
# "a crashed sweep can leave a camera mis-set" — the prefix, not a truncated "miss".
mis = "mis"
# `v4l2_streamparm`, `v4l2_captureparm` and their fields. The kernel's spelling of
# "parameters", which we do not get to correct: the names come out of bindgen and appear
# in the offsets derived from it.
parm = "parm"
# `/proc/<pid>/status`'s `CapInh:` line, quoted verbatim in a measurement transcript
# \[PF:21\]. A transcript that was corrected is not a transcript.
Inh = "Inh"
# `O_WRONLY`, as `rustix::fs::OFlags::WRONLY` spells it. POSIX's name for the flag the
# daemon opens a photo's destination with (note N51's discharge); a flag name we do not
# get to correct, in code and in the note that explains it.
WRONLY = "WRONLY"
